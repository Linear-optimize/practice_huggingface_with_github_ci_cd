name: Model CD - Sync to HF

on:
  push:
    branches: [ main ]
    # 只有当模型文件或准确率文件更新时才触发，节省 Actions 时间
    paths:
      - 'model.joblib'
      - 'accuracy.txt'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # 如果你的 model.joblib 很大，记得开启 LFS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HF Tool
        run: pip install huggingface_hub

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: "renePolychinski/distilbert-imdb"
        run: |
          python - <<EOF
          import os
          from huggingface_hub import HfApi, login
          
          token = os.getenv("HF_TOKEN")
          repo_id = os.getenv("HF_REPO")
          
          if not os.path.exists("model.joblib"):
              print("❌ 错误: 未在仓库中找到 model.joblib，请先在本地训练并提交文件。")
              exit(1)
          
          login(token=token)
          api = HfApi()
          
          api.create_repo(repo_id=repo_id, exist_ok=True)
          
          # 获取本地准确率写进 README
          acc = "Unknown"
          if os.path.exists("accuracy.txt"):
              with open("accuracy.txt", "r") as f:
                  acc = f.read().strip()

          # 生成带元数据的 Model Card (解决你之前的 YAML Warning)
          readme_content = f"""---
          language: en
          license: mit
          tags:
          - text-classification
          - imdb
          metrics:
          - accuracy
          ---
          # IMDB Sentiment Classifier
          
          - **Accuracy**: {acc}
          - **Status**: Verified Local Training, Automated CD Deployment.
          """
          with open("README.md", "w") as f:
              f.write(readme_content)

          # 上传
          for file in ["model.joblib", "README.md", "accuracy.txt"]:
              if os.path.exists(file):
                  print(f"Uploading {file}...")
                  api.upload_file(path_or_fileobj=file, path_in_repo=file, repo_id=repo_id)
          
          print("✨ 模型已同步至 Hugging Face！")
          EOF
